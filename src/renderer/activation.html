<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Activar Licencia — Control de Lavandería</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">Control de Lavandería</span>
    <div class="titlebar-controls">
      <button class="titlebar-btn" onclick="window.api.app.minimize()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button class="titlebar-btn close" onclick="window.api.app.close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="activation-page">
    <div class="activation-card">
      <img src="../../assets/logo.png" alt="Logo" class="activation-logo">
      <h1 class="activation-title">Bienvenido</h1>
      <p class="activation-subtitle">Ingrese su código de licencia para activar la aplicación</p>
      
      <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left;">
        <p style="color: rgba(255,255,255,0.7); font-size: 12px; margin: 0 0 6px;">ID de esta Computadora (Envíalo a tu proveedor):</p>
        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px;">
          <span id="deviceIdDisplay" style="color: #38bdf8; font-weight: bold; font-family: monospace; font-size: 15px; letter-spacing: 1px;">Cargando...</span>
          <button onclick="copyDeviceId()" style="background: none; border: none; color: white; cursor: pointer; padding: 4px;" title="Copiar ID">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
      </div>
      
      <input type="text" id="licenseCode" class="activation-input" placeholder="Ingrese su código de licencia" maxlength="50" autocomplete="off" autofocus>
      
      <button id="activateBtn" class="btn btn-primary activation-btn" onclick="activateLicense()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
        Activar Licencia
      </button>

      <div id="loadingIndicator" class="activation-loading">
        <div class="spinner spinner-sm"></div>
        <span>Verificando licencia...</span>
      </div>

      <div id="errorMessage" class="activation-error"></div>
    </div>
  </div>

  <script>
    const codeInput = document.getElementById('licenseCode');
    const activateBtn = document.getElementById('activateBtn');
    const loadingEl = document.getElementById('loadingIndicator');
    const errorEl = document.getElementById('errorMessage');
    
    let currentDeviceId = '';

    // Cargar ID de Dispositivo
    (async function loadDeviceId() {
      try {
        const info = await window.api.license.getInfo();
        if (info.success && info.data && info.data.machineId) {
          currentDeviceId = info.data.machineId;
          document.getElementById('deviceIdDisplay').textContent = currentDeviceId;
        } else {
          document.getElementById('deviceIdDisplay').textContent = 'Error al cargar ID';
        }
      } catch(e) {
        document.getElementById('deviceIdDisplay').textContent = 'Desconocido';
      }
    })();

    function copyDeviceId() {
      if (currentDeviceId) {
        navigator.clipboard.writeText(currentDeviceId).then(() => {
          alert("ID de Dispositivo copiado: " + currentDeviceId);
        }).catch(() => {
          alert("No se pudo copiar el ID.");
        });
      }
    }

    // Convertir a mayúsculas mientras escribe
    codeInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') activateLicense();
    });

    async function activateLicense() {
      const code = codeInput.value.trim();
      if (!code) {
        showError('Por favor, ingrese un código de licencia');
        return;
      }

      activateBtn.disabled = true;
      loadingEl.classList.add('show');
      errorEl.classList.remove('show');

      try {
        console.log('[Activation] Enviando código:', code);
        const result = await window.api.license.activate(code);
        console.log('[Activation] Resultado recibido:', JSON.stringify(result));
        
        if (result && result.success) {
          // Licencia activada — recargar la app
          await window.api.app.loadPage('index.html');
        } else {
          showError((result && result.error) || 'No se pudo activar la licencia');
        }
      } catch (err) {
        console.error('[Activation] Excepción:', err);
        showError('Error de conexión: ' + (err.message || 'Verifique su internet e intente nuevamente.'));
      } finally {
        activateBtn.disabled = false;
        loadingEl.classList.remove('show');
      }
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }
  </script>
</body>
</html>
